services:
  goofy_cdn:
    container_name: goofy_cdn
    build: .
    volumes:
      - "/etc/letsencrypt:/etc/letsencrypt"
      - "/home/pub/app-data/goofy-cdn/data:/srv/data"
    networks:
      - "nginx-router_default"
      - "default"
    restart: always
    ports:
      - "12370:443"

volumes:
  data:
networks:
  default:
  nginx-router_default:
    external: true
